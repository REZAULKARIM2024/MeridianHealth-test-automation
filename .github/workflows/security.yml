name: Security scan (ZAP) + Docker stack

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"      # weekly, Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    name: OWASP ZAP baseline on the Docker Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Start the full stack (db + api + web) with Docker Compose
        run: docker compose up -d --build

      - name: Wait for the stack to be healthy
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:5173/api/health && exit 0
            sleep 3
          done
          docker compose logs --no-color | tail -n 100
          exit 1

      - name: Compose smoke check (SPA + proxied API)
        run: |
          curl -fsS http://localhost:5173/ | grep -q '<div id="root">'
          curl -fsS http://localhost:5173/api/doctors | head -c 200

      - name: ZAP baseline scan (passive, non-destructive)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:5173
          fail_action: false          # report-only; see security/README.md
          allow_issue_writing: false
          artifact_name: zap-baseline-report

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -n 200

      - name: Tear down
        if: always()
        run: docker compose down -v
